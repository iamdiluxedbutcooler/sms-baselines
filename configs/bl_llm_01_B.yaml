paper_id: NA
baseline_id: bl_llm_01_B
description: "Few-shot Mixtral 8x7B with 5 examples (Salman 2025)."
module: "models.llm.BL_LLM_01_B_salman2025"
preprocessing:
  - prompt_format: "few_shot"
  - input_format: "text_to_classification"
  - max_length: 1024
  - truncation: true
features:
  type: "llm_inference"
  model_type: "open_source"
  no_embeddings: true
model:
  type: "mixtral_few_shot"
  base_model: "mistralai/Mixtral-8x7B-Instruct-v0.1"
  api_type: "huggingface"
  generation_config:
    max_new_tokens: 10
    temperature: 0.1
    do_sample: false
  prompt_template: |
    You are an SMS spam detection system. Classify the following SMS message as exactly one of: 'spam', 'ham', or 'smishing'.
    
    Definitions:
    - 'spam': Unwanted promotional or advertisement messages
    - 'ham': Legitimate, normal messages
    - 'smishing': Phishing attacks via SMS trying to steal personal information or credentials
    
    Here are some examples:
    
    Example 1:
    SMS Message: "Free entry in 2 a wkly comp to win FA Cup final tkts 21st May 2005. Text FA to 87121"
    Classification: spam
    
    Example 2:
    SMS Message: "I'll be home in about 20 minutes"
    Classification: ham
    
    Example 3:
    SMS Message: "URGENT: Your bank account has been suspended. Click here to verify: http://bit.ly/xyz123"
    Classification: smishing
    
    Example 4:
    SMS Message: "50% OFF all items this weekend only! Shop now at www.sale.com"
    Classification: spam
    
    Example 5:
    SMS Message: "Can you pick up some milk on your way home?"
    Classification: ham
    
    Now classify this message:
    
    SMS Message: {text}
    
    Classification:
training:
  method: "none"
  learning_type: "few_shot"
  num_examples: 5
  example_selection: "balanced"
  repeats_for_variance: 5
  seed_base: 42
inference:
  expected_outputs: ["spam", "ham", "smishing"]
  default_label: "ham"
libraries:
  preferred: ["transformers", "torch"]
  required_versions:
    transformers: ">=4.36.0"
    torch: ">=2.0.0"
notes: "Few-shot learning with 5 in-context examples (2 spam, 2 ham, 1 smishing). No weight updates. Model learns from examples in prompt. Expected accuracy ~88-89% on OOD data (improvement over zero-shot)."