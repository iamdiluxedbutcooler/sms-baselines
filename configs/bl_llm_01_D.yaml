paper_id: P_salman2025
baseline_id: bl_llm_01_D
description: "Few-shot GPT-4o with 5 examples (Salman 2025)."
module: "models.llm.BL_LLM_01_D_salman2025"
preprocessing:
  - prompt_format: "few_shot"
  - input_format: "text_to_classification"
  - max_length: 1024
  - truncation: true
features:
  type: "llm_inference"
  model_type: "commercial"
  no_embeddings: true
model:
  type: "gpt4o_few_shot"
  base_model: "gpt-4o"
  api_type: "openai"
  generation_config:
    max_tokens: 10
    temperature: 0.1
  system_prompt: "You are an SMS spam detection assistant. Respond with only one word: spam, ham, or smishing."
  user_prompt_template: |
    You are an SMS spam detection system. Classify the following SMS message as exactly one of: 'spam', 'ham', or 'smishing'.
    
    Definitions:
    - 'spam': Unwanted promotional or advertisement messages
    - 'ham': Legitimate, normal messages
    - 'smishing': Phishing attacks via SMS trying to steal personal information or credentials
    
    Here are some examples:
    
    Example 1:
    SMS Message: "Free entry in 2 a wkly comp to win FA Cup final tkts 21st May 2005. Text FA to 87121"
    Classification: spam
    
    Example 2:
    SMS Message: "I'll be home in about 20 minutes"
    Classification: ham
    
    Example 3:
    SMS Message: "URGENT: Your bank account has been suspended. Click here to verify: http://bit.ly/xyz123"
    Classification: smishing
    
    Example 4:
    SMS Message: "50% OFF all items this weekend only! Shop now at www.sale.com"
    Classification: spam
    
    Example 5:
    SMS Message: "Can you pick up some milk on your way home?"
    Classification: ham
    
    Now classify this message:
    
    SMS Message: {text}
    
    Classification:
training:
  method: "none"
  learning_type: "few_shot"
  num_examples: 5
  example_selection: "balanced"
  repeats_for_variance: 5
  seed_base: 42
inference:
  expected_outputs: ["spam", "ham", "smishing"]
  default_label: "ham"
  api_rate_limit: "10000 TPM"
  cost_per_1k_tokens:
    input: 0.0025
    output: 0.01
libraries:
  preferred: ["openai"]
  required_versions:
    openai: ">=1.0.0"
notes: "Few-shot learning with 5 in-context examples via GPT-4o API. No weight updates. More powerful model + examples = best zero/few-shot performance. Expected accuracy ~90-92% on OOD data. Higher cost than zero-shot due to longer prompts (~$0.015-0.025 per 1000 messages)."