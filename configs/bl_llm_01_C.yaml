paper_id: NA
baseline_id: bl_llm_01_C
description: "Zero-shot GPT-4o for SMS spam detection (Salman 2025)."
module: "models.llm.BL_LLM_01_C_salman2025"
preprocessing:
  - prompt_format: "zero_shot"
  - input_format: "text_to_classification"
  - max_length: 512
  - truncation: true
features:
  type: "llm_inference"
  model_type: "commercial"
  no_embeddings: true
model:
  type: "gpt4o_zero_shot"
  base_model: "gpt-4o"
  api_type: "openai"
  generation_config:
    max_tokens: 10
    temperature: 0.1
  system_prompt: "You are an SMS spam detection assistant. Respond with only one word: spam, ham, or smishing."
  user_prompt_template: |
    You are an SMS spam detection system. Classify the following SMS message as exactly one of: 'spam', 'ham', or 'smishing'.
    
    Definitions:
    - 'spam': Unwanted promotional or advertisement messages
    - 'ham': Legitimate, normal messages
    - 'smishing': Phishing attacks via SMS trying to steal personal information or credentials
    
    SMS Message: {text}
    
    Classification:
training:
  method: "none"
  learning_type: "zero_shot"
  repeats_for_variance: 5
  seed_base: 42
inference:
  expected_outputs: ["spam", "ham", "smishing"]
  default_label: "ham"
  api_rate_limit: "10000 TPM"
  cost_per_1k_tokens:
    input: 0.0025
    output: 0.01
libraries:
  preferred: ["openai"]
  required_versions:
    openai: ">=1.0.0"
notes: "Zero-shot learning with GPT-4o via OpenAI API. No training on task-specific data. More powerful base model than Mixtral. Expected accuracy ~88-90% on OOD data. Requires API key and incurs costs (~$0.01-0.02 per 1000 messages)."